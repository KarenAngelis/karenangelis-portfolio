services:
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PORTFOLIO_DOMAIN: ${PORTFOLIO_DOMAIN:-karenangelis.com}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - trends-api
      - resume-api
      - stats-api
      - domains-api
  trends-api:
    build:
      context: .
      dockerfile: apps/trends-api/Dockerfile
    restart: unless-stopped
  resume-api:
    build:
      context: .
      dockerfile: apps/resume-api/Dockerfile
    restart: unless-stopped
  domains-api:
    build:
      context: .
      dockerfile: apps/domains-api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.domains
        required: false
    volumes:
      - domains_data:/data
  stats-api:
    build:
      context: .
      dockerfile: apps/stats-api/Dockerfile
    restart: unless-stopped
    volumes:
      - stats_data:/data
volumes:
  domains_data:
  stats_data:
  caddy_data:
  caddy_config:
