name: Shared resume app Android and Web
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/resume-compose/**'
      - 'apps/resume-android/**'
      - 'web/data/profile.json'
      - '.github/workflows/resume-multiplatform.yml'
jobs:
  shared-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: gradle -p apps/resume-android :shared:wasmJsBrowserDistribution :app:assemblePortfolio --no-daemon
      - run: |
          mkdir -p app-artifacts
          tar -czf app-artifacts/resume-web.tar.gz -C apps/resume-compose/shared/build/dist/wasmJs/productionExecutable .
          cp apps/resume-android/app/build/outputs/apk/portfolio/app-portfolio.apk app-artifacts/karenangelis-curriculo.apk
          sha256sum app-artifacts/* > app-artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: resume-shared-android-web
          path: app-artifacts/
