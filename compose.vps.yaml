# Uses the existing host Caddy proxy; all traffic enters on localhost:4180.
services:
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web.prebuilt
    restart: unless-stopped
    ports:
      - "127.0.0.1:4180:80"
    environment:
      PORTFOLIO_DOMAIN: ":80"
    depends_on:
      - trends-api
      - resume-api
      - stats-api
      - domains-api
  trends-api:
    build:
      context: .
      dockerfile: apps/trends-api/Dockerfile
    restart: unless-stopped
  resume-api:
    build:
      context: .
      dockerfile: apps/resume-api/Dockerfile
    restart: unless-stopped
  domains-api:
    build:
      context: .
      dockerfile: apps/domains-api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.domains
        required: false
    volumes:
      - domains_data:/data
  stats-api:
    build:
      context: .
      dockerfile: apps/stats-api/Dockerfile
    restart: unless-stopped
    volumes:
      - stats_data:/data
volumes:
  domains_data:
  stats_data:
