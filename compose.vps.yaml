# Uses the existing host Caddy proxy; all traffic enters on localhost:4180.
services:
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web.prebuilt
    restart: unless-stopped
    ports:
      - "127.0.0.1:4180:80"
    environment:
      PORTFOLIO_DOMAIN: ":80"
    depends_on:
      - trends-api
      - resume-api
      - stats-api
      - career-api
  trends-api:
    build:
      context: .
      dockerfile: apps/trends-api/Dockerfile
    restart: unless-stopped
  resume-api:
    build:
      context: .
      dockerfile: apps/resume-api/Dockerfile
    restart: unless-stopped
  stats-api:
    build:
      context: .
      dockerfile: apps/stats-api/Dockerfile
    restart: unless-stopped
    volumes:
      - stats_data:/data
  career-api:
    build:
      context: .
      dockerfile: apps/career-api/Dockerfile
    restart: unless-stopped
    environment:
      CAREER_PUBLIC_URL: "https://karenangelis.com"
      CAREER_OWNER_EMAIL: "${CAREER_OWNER_EMAIL:-karen.denich@gmail.com}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      CAREER_ENCRYPTION_KEY: "${CAREER_ENCRYPTION_KEY:-}"
      CAREER_CODEX_MODEL: "${CAREER_CODEX_MODEL:-}"
      CAREER_WORKER_ENABLED: "${CAREER_WORKER_ENABLED:-true}"
      CAREER_WORKER_INTERVAL: "${CAREER_WORKER_INTERVAL:-600}"
    volumes:
      - career_data:/data
volumes:
  stats_data:
  career_data:
